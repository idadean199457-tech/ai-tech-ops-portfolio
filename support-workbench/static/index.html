<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 技术支持工单台</title><style>
:root{--ink:#172033;--muted:#6a7383;--line:#dbe1ea;--teal:#0f8d88;--bg:#f4f7f8}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:1100px;margin:auto;padding:38px 24px}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:20px}h1{margin:0;font-size:30px}h1 span{color:var(--teal)}p{color:var(--muted);line-height:1.6}.layout{display:grid;grid-template-columns:340px 1fr;gap:20px;margin-top:24px}.panel{background:#fff;border:1px solid var(--line);padding:20px}label{display:block;font-size:13px;margin:12px 0 6px;color:var(--muted)}input,select,textarea{width:100%;padding:10px;border:1px solid #c9d2df;font:14px inherit}textarea{min-height:110px;resize:vertical}button{margin-top:16px;background:var(--teal);color:#fff;border:0;padding:10px 14px;font:600 14px inherit;cursor:pointer}.ticket{border:1px solid var(--line);padding:16px;margin-bottom:12px}.ticket header{padding:0 0 9px;border:0;align-items:center}.ticket h3{margin:0;font-size:16px}.meta{font-size:12px;color:var(--muted)}.tag{font-size:12px;background:#e9f7f5;color:#08706b;padding:4px 7px}.diag{background:#f7fafb;padding:10px;font-size:13px;white-space:pre-wrap;line-height:1.6}.status{background:#fff;color:var(--ink);border:1px solid var(--line);margin:0 0 0 8px;padding:6px 8px}@media(max-width:760px){main{padding:24px 14px}.layout{grid-template-columns:1fr}header{display:block}}
</style></head><body><main><header><div><h1>AI 技术支持<span>工单台</span></h1><p>客户问题记录、诊断建议、研发协同与知识库沉淀。</p></div><div class="meta">本地 SQLite 数据库</div></header><div class="layout"><section class="panel"><h2>新建问题</h2><label>问题标题</label><input id="title" placeholder="例如：知识库接口调用超时"><label>客户/环境</label><input id="customer" placeholder="例如：测试租户 / Windows"><label>问题类别</label><select id="category"><option>模型与接口</option><option>知识库</option><option>账号权限</option><option>产品接入</option></select><label>优先级</label><select id="priority"><option>P2</option><option>P1</option><option>P3</option></select><label>现象、复现步骤和影响范围</label><textarea id="detail" placeholder="请补充报错、发生时间、复现步骤和已尝试操作"></textarea><button id="create">创建并生成诊断建议</button></section><section><div id="tickets"></div></section></div></main><script>
const api='/api/tickets'; const statuses=['待诊断','处理中','待客户验证','已关闭'];
function esc(v){const n=document.createElement('span');n.textContent=v;return n.innerHTML} async function load(){const items=await fetch(api).then(r=>r.json());const root=document.querySelector('#tickets');root.innerHTML=items.map(t=>`<article class="ticket"><header><div><h3>#${t.id} ${esc(t.title)}</h3><div class="meta">${esc(t.customer)} · ${esc(t.category)} · ${t.created_at}</div></div><div><span class="tag">${t.priority}</span><select class="status" data-id="${t.id}">${statuses.map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div></header><p>${esc(t.detail)}</p><div class="diag"><b>诊断建议</b>\n${esc(t.diagnosis)}</div></article>`).join('');document.querySelectorAll('.status').forEach(s=>s.onchange=()=>fetch(`${api}/${s.dataset.id}/status`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s.value})}));}
document.querySelector('#create').onclick=async()=>{const payload=Object.fromEntries(['title','customer','category','priority','detail'].map(id=>[id,document.querySelector('#'+id).value]));const res=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await res.json();if(data.error){alert(data.error);return}document.querySelector('#title').value='';document.querySelector('#detail').value='';load()};load();
</script></body></html>
